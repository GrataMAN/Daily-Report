    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .card-container {
            perspective: 1000px;
            height: 200px;
            width: 300px;
            margin: 20px auto;
        }
        .card {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }
        .card.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: white;
            font-size: 24px;
            font-weight: bold;
        }
        .card-back {
            transform: rotateY(180deg);
        }
        .buttons {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
        }
        button:hover {
            background-color: #45a049;
        }
        .dont-know {
            background-color: #f44336;
        }
        .dont-know:hover {
            background-color: #da190b;
        }
        .favorite-btn {
            background-color: #ff9800;
            margin: 10px;
        }
        .favorite-btn:hover {
            background-color: #e68900;
        }
        .section {
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: white;
        }
        .favorites-list {
            list-style: none;
            padding: 0;
        }
        .favorites-list li {
            margin: 5px 0;
            padding: 5px;
            border-bottom: 1px solid #eee;
        }
        #progress {
            margin: 10px 0;
            font-size: 14px;
            color: #666;
        }
        input[type="text"] {
            padding: 5px;
            margin: 5px;
            width: 200px;
        }
    </style>
</head>

        // Инициализация слов с прогрессом
        let words = JSON.parse(localStorage.getItem('words')) || [];
        if (words.length === 0) {
            words = wordsData.map((word, index) => ({
                id: index,
                arabic: word.arabic,
                russian: word.russian,
                progress: 0, // 0 - новый, 1-5 - уровни
                nextReview: new Date().getTime(), // Немедленный просмотр для новых
                favorites: false
            }));
            localStorage.setItem('words', JSON.stringify(words));
        }

        let currentWordIndex = -1;
        let isFlipped = false;

        const intervals = [ // Интервалы в миллисекундах: 30 мин, 1 день, 3 дня, 7 дней, 14 дней, 30 дней
            30 * 60 * 1000,
            24 * 60 * 60 * 1000,
            3 * 24 * 60 * 60 * 1000,
            7 * 24 * 60 * 60 * 1000,
            14 * 24 * 60 * 60 * 1000,
            30 * 24 * 60 * 60 * 1000
        ];

        function getDueWords() {
            const now = new Date().getTime();
            return words.filter(word => word.nextReview <= now);
        }

        function showNextCard() {
            const dueWords = getDueWords();
            if (dueWords.length === 0) {
                document.getElementById('front').innerHTML = 'Все слова выучены! Прогресс обновится позже.';
                document.getElementById('back').innerHTML = '';
                document.getElementById('buttons').style.display = 'none';
                document.getElementById('nextBtn').style.display = 'none';
                return;
            }

            // Выбираем случайное слово из due
            const randomIndex = Math.floor(Math.random() * dueWords.length);
            const word = dueWords[randomIndex];
            currentWordIndex = words.findIndex(w => w.id === word.id);

            document.getElementById('front').innerHTML = word.arabic;
            document.getElementById('back').innerHTML = word.russian;
            document.getElementById('card').classList.remove('flipped');
            isFlipped = false;
            document.getElementById('buttons').style.display = 'flex';
            document.getElementById('nextBtn').style.display = 'none';

            updateProgress();
            updateFavoritesList();
        }

        function flipCard() {
            if (!isFlipped) {
                document.getElementById('card').classList.add('flipped');
                isFlipped = true;
                setTimeout(() => {
                    document.getElementById('nextBtn').style.display = 'block';
                    document.getElementById('buttons').style.display = 'none';
                }, 2000); // Показать перевод 2 секунды
            }
        }

        function handleKnow() {
            words[currentWordIndex].progress = Math.min(words[currentWordIndex].progress + 1, 5);
            const interval = intervals[words[currentWordIndex].progress - 1] || intervals[5];
            words[currentWordIndex].nextReview = new Date().getTime() + interval;
            saveWords();
            flipCard();
        }

        function handleDontKnow() {
            words[currentWordIndex].progress = Math.max(0, words[currentWordIndex].progress - 1);
            const interval = intervals[0]; // Сброс к минимальному интервалу
            words[currentWordIndex].nextReview = new Date().getTime() + interval;
            saveWords();
            flipCard();
        }

        function toggleFavorite() {
            words[currentWordIndex].favorites = !words[currentWordIndex].favorites;
            saveWords();
            updateFavoritesList();
            document.getElementById('favoriteBtn').textContent = words[currentWordIndex].favorites ? 'Убрать из избранного' : 'В избранное';
        }

        function updateProgress() {
            const dueWords = getDueWords();
            document.getElementById('progress').innerHTML = `Карточек для повторения: ${dueWords.length} / ${words.length}`;
        }

        function updateFavoritesList() {
            const favorites = words.filter(w => w.favorites);
            const list = document.getElementById('favoritesList');
            list.innerHTML = '';
            favorites.forEach(word => {
                const li = document.createElement('li');
                li.innerHTML = `<strong>${word.arabic}</strong> - ${word.russian}`;
                list.appendChild(li);
            });
        }

        function saveWords() {
            localStorage.setItem('words', JSON.stringify(words));
        }

        function addNewWord() {
            const arabic = document.getElementById('arabicInput').value.trim();
            const russian = document.getElementById('russianInput').value.trim();
            if (arabic && russian) {
                const newId = words.length > 0 ? Math.max(...words.map(w => w.id)) + 1 : 0;
                words.push({
                    id: newId,
                    arabic,
                    russian,
                    progress: 0,
                    nextReview: new Date().getTime(),
                    favorites: false
                });
                saveWords();
                document.getElementById('arabicInput').value = '';
                document.getElementById('russianInput').value = '';
                updateProgress();
                updateFavoritesList();
                alert('Слово добавлено!');
            }
        }

        // Event listeners
        document.getElementById('knowBtn').addEventListener('click', handleKnow);
        document.getElementById('dontKnowBtn').addEventListener('click', handleDontKnow);
        document.getElementById('favoriteBtn').addEventListener('click', toggleFavorite);
        document.getElementById('nextBtn').addEventListener('click', showNextCard);
        document.getElementById('addWordBtn').addEventListener('click', addNewWord);
